<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Lifeline: Supply Chain Crisis Lab</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #94a3b8;
            font-weight: 400;
        }

        .content {
            flex: 1;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(96, 165, 250, 0.3);
            background: rgba(15, 23, 42, 0.95);
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 32px;
        }

        .welcome-card {
            text-align: center;
            max-width: 600px;
        }

        .welcome-description {
            font-size: 16px;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .button-secondary:hover {
            background: rgba(96, 165, 250, 0.1);
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 8px 16px rgba(96, 165, 250, 0.2);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(96, 165, 250, 0.2);
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #60a5fa;
        }

        .stat-detail {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .progress-bar {
            background: rgba(148, 163, 184, 0.1);
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
            height: 100%;
            transition: width 0.6s ease;
            border-radius: 4px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #f1f5f9;
        }

        .section-desc {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .action-card {
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-card:hover {
            border-color: rgba(96, 165, 250, 0.4);
            background: rgba(30, 41, 59, 0.9);
            transform: translateY(-2px);
        }

        .action-card.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .action-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .action-desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .action-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #94a3b8;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.high {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .badge.medium {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }

        .badge.low {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .dialogue-box {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .dialogue-speaker {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #60a5fa;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .dialogue-text {
            font-size: 16px;
            line-height: 1.8;
            color: #e2e8f0;
            margin-bottom: 24px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-button {
            text-align: left;
            padding: 16px;
            background: rgba(148, 163, 184, 0.05);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 8px;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            line-height: 1.6;
        }

        .choice-button:hover {
            background: rgba(96, 165, 250, 0.1);
            border-color: rgba(96, 165, 250, 0.4);
            transform: translateX(4px);
        }

        .score-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .score-item {
            text-align: center;
        }

        .score-number {
            font-size: 28px;
            font-weight: 700;
            color: #60a5fa;
        }

        .score-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 28px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-button {
            text-align: left;
            padding: 16px;
            background: rgba(148, 163, 184, 0.05);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 8px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .option-button:hover {
            background: rgba(96, 165, 250, 0.1);
            border-color: rgba(96, 165, 250, 0.4);
        }

        .option-button.selected {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #60a5fa;
        }

        .investment-card {
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .investment-card:hover {
            border-color: rgba(96, 165, 250, 0.4);
            background: rgba(30, 41, 59, 0.9);
        }

        .investment-card.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .investment-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f1f5f9;
        }

        .investment-desc {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .impact-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .impact-item {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .impact-icon {
            color: #60a5fa;
            font-weight: bold;
        }

        .selection-counter {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .dashboard-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 24px;
        }

        .score-category {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .category-score {
            font-size: 48px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 16px;
        }

        .feedback-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .feedback-title {
            font-size: 14px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .feedback-text {
            font-size: 14px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .crisis-header {
            margin-bottom: 32px;
        }

        .crisis-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .crisis-description {
            font-size: 16px;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 24px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .metric-box {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 16px;
        }

        .metric-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .round-indicator {
            font-size: 12px;
            color: #64748b;
        }

        .crisis-impact {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }

        .impact-stat {
            flex: 1;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .impact-stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .impact-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #f87171;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .section-header {
            margin-bottom: 32px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 36px;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .grid-3 {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 24px;
            }

            .button {
                padding: 12px 24px;
                font-size: 14px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Utility Functions
        const generateCompany = () => {
            const industries = [
                { name: 'Electronics Manufacturing', revenue: 2400 },
                { name: 'Automotive Supply', revenue: 3100 },
                { name: 'Pharmaceutical', revenue: 1800 },
                { name: 'Fashion Retail', revenue: 920 },
                { name: 'Food & Beverage', revenue: 1640 },
                { name: 'Semiconductors', revenue: 2800 },
            ];

            const regions = ['Southeast Asia', 'Europe', 'North America', 'South America'];
            const ind = industries[Math.floor(Math.random() * industries.length)];

            return {
                name: `${['Nexus', 'Catalyst', 'Vertex', 'Pinnacle', 'Summit'][Math.floor(Math.random() * 5)]} Industries`,
                industry: ind.name,
                revenue: ind.revenue + Math.random() * 500,
                factories: Math.floor(Math.random() * 8) + 3,
                warehouses: Math.floor(Math.random() * 12) + 5,
                suppliers: Math.floor(Math.random() * 20) + 15,
                inventoryDays: Math.floor(Math.random() * 30) + 20,
                leadTime: Math.floor(Math.random() * 45) + 15,
                mainRegions: regions.sort(() => 0.5 - Math.random()).slice(0, 2),
            };
        };

        const generateCrisis = () => {
            const crises = [
                {
                    name: 'Factory Fire',
                    description: 'A major fire has destroyed one of your primary manufacturing facilities, taking 40% of production capacity offline. Emergency services are on scene.',
                    urgency: 'critical',
                    businessImpact: 'severe',
                    costImpact: -450,
                    inventoryImpact: -40,
                    profitImpact: -60,
                    deliveryImpact: -45,
                    satisfactionImpact: -50,
                },
                {
                    name: 'Supplier Bankruptcy',
                    description: 'Your largest raw materials supplier has filed for bankruptcy. They supplied 35% of your key inputs. Alternative suppliers exist but at 28% higher cost.',
                    urgency: 'critical',
                    businessImpact: 'severe',
                    costImpact: -280,
                    inventoryImpact: -35,
                    profitImpact: -40,
                    deliveryImpact: -30,
                    satisfactionImpact: -35,
                },
                {
                    name: 'Port Strike',
                    description: 'Dockworkers at your main export port have initiated a strike lasting indefinitely. 60% of outbound shipments are halted. Your inventory is piling up.',
                    urgency: 'high',
                    businessImpact: 'severe',
                    costImpact: -200,
                    inventoryImpact: 50,
                    profitImpact: -55,
                    deliveryImpact: -70,
                    satisfactionImpact: -65,
                },
                {
                    name: 'Cyberattack',
                    description: 'Ransomware has encrypted your inventory management and order systems. Operations are paralyzed. Recovery time: 5-7 days. Hackers demand $2.3M.',
                    urgency: 'critical',
                    businessImpact: 'severe',
                    costImpact: -350,
                    inventoryImpact: 0,
                    profitImpact: -50,
                    deliveryImpact: -80,
                    satisfactionImpact: -60,
                },
                {
                    name: 'Severe Flooding',
                    description: 'Unprecedented floods have hit the region housing two major warehouses and a key supplier factory. Roads are impassable for 10+ days.',
                    urgency: 'critical',
                    businessImpact: 'severe',
                    costImpact: -320,
                    inventoryImpact: -45,
                    profitImpact: -45,
                    deliveryImpact: -60,
                    satisfactionImpact: -55,
                },
                {
                    name: 'Raw Material Shortage',
                    description: 'A global shortage of critical raw materials (lithium, rare earths) has driven prices up 42% overnight. Availability is limited to 60% of normal orders.',
                    urgency: 'high',
                    businessImpact: 'moderate-severe',
                    costImpact: -240,
                    inventoryImpact: -25,
                    profitImpact: -35,
                    deliveryImpact: -20,
                    satisfactionImpact: -25,
                },
                {
                    name: 'Political Conflict',
                    description: 'Trade sanctions have been imposed on your primary manufacturing region. Exports to 40% of your markets are now illegal. Your supply chain is disrupted.',
                    urgency: 'high',
                    businessImpact: 'severe',
                    costImpact: -380,
                    inventoryImpact: 35,
                    profitImpact: -70,
                    deliveryImpact: -50,
                    satisfactionImpact: -65,
                },
                {
                    name: 'Shipping Delay Cascade',
                    description: 'A major container ship sank with your inventory. Simultaneously, port congestion has tripled lead times to 90+ days. Your committed orders are at risk.',
                    urgency: 'high',
                    businessImpact: 'severe',
                    costImpact: -160,
                    inventoryImpact: -50,
                    profitImpact: -65,
                    deliveryImpact: -85,
                    satisfactionImpact: -70,
                },
            ];

            return crises[Math.floor(Math.random() * crises.length)];
        };

        const ProgressBar = ({ value, max = 100, label }) => {
            const percentage = Math.min(Math.max((value / max) * 100, 0), 100);
            return (
                <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                        <span style={{ fontSize: '12px', color: '#94a3b8', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.5px' }}>{label}</span>
                        <span style={{ fontSize: '14px', fontWeight: 700, color: '#60a5fa' }}>{Math.round(value)}</span>
                    </div>
                    <div className="progress-bar">
                        <div className="progress-fill" style={{ width: `${percentage}%` }}></div>
                    </div>
                </div>
            );
        };

        const WelcomeScreen = ({ onStart }) => (
            <div className="welcome-screen">
                <div className="welcome-card card">
                    <h2 style={{ fontSize: '28px', marginBottom: '16px' }}>Welcome to Operation Lifeline</h2>
                    <p className="welcome-description">
                        You're the Chief Supply Chain Officer of a global company. In the next 30 minutes, you'll face a supply chain crisis that could make or break your business. Your decisions will test your strategic thinking, negotiation skills, and crisis management abilities.
                    </p>
                    <p className="welcome-description">
                        Every playthrough is unique. Every decision matters. Are you ready to lead your company through chaos?
                    </p>
                    <button className="button" onClick={onStart}>
                        Start Simulation
                    </button>
                </div>
            </div>
        );

        const CompanyScreen = ({ company, onContinue }) => (
            <div>
                <div className="section-header">
                    <h2 className="section-title">Your Company</h2>
                    <p className="section-desc">This is what you're working with. These are your resources, constraints, and vulnerabilities.</p>
                </div>
                
                <div className="grid-2">
                    <div className="card">
                        <div style={{ marginBottom: '20px' }}>
                            <h3 style={{ fontSize: '24px', fontWeight: 700, marginBottom: '4px' }}>{company.name}</h3>
                            <p style={{ fontSize: '14px', color: '#94a3b8' }}>{company.industry}</p>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                            <div>
                                <div className="stat-label">Annual Revenue</div>
                                <div className="stat-value">${company.revenue.toFixed(1)}B</div>
                            </div>
                            <div>
                                <div className="stat-label">Inventory Days</div>
                                <div className="stat-value">{company.inventoryDays}</div>
                            </div>
                            <div>
                                <div className="stat-label">Lead Time</div>
                                <div className="stat-value">{company.leadTime} days</div>
                            </div>
                            <div>
                                <div className="stat-label">Countries</div>
                                <div className="stat-value">{company.mainRegions.length}</div>
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <h3 style={{ fontSize: '18px', fontWeight: 700, marginBottom: '16px' }}>Global Footprint</h3>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                            <div className="metric-box">
                                <div className="stat-label">Manufacturing Facilities</div>
                                <div className="stat-value">{company.factories}</div>
                            </div>
                            <div className="metric-box">
                                <div className="stat-label">Distribution Centers</div>
                                <div className="stat-value">{company.warehouses}</div>
                            </div>
                            <div className="metric-box">
                                <div className="stat-label">Active Suppliers</div>
                                <div className="stat-value">{company.suppliers}</div>
                            </div>
                            <div className="metric-box">
                                <div className="stat-label">Key Regions</div>
                                <div className="stat-value">{company.mainRegions.length}</div>
                            </div>
                        </div>
                        <p style={{ fontSize: '13px', color: '#94a3b8', marginTop: '16px' }}>
                            Primary regions: {company.mainRegions.join(', ')}
                        </p>
                    </div>

                        <div className="feedback-box">
                            <div className="feedback-title">⚠️ Biggest Mistakes</div>
                            <div className="feedback-text">
                                {mistakes.map((mistake, idx) => (
                                    <div key={idx} style={{ marginBottom: '8px' }}>• {mistake}</div>
                                ))}
                            </div>
                        </div>
                    )}

                    {victories.length > 0 && (
                        <div className="feedback-box" style={{ background: 'rgba(34, 197, 94, 0.1)', borderColor: 'rgba(34, 197, 94, 0.2)' }}>
                            <div className="feedback-title" style={{ color: '#86efac' }}>✓ Best Decisions</div>
                            <div className="feedback-text">
                                {victories.map((victory, idx) => (
                                    <div key={idx} style={{ marginBottom: '8px' }}>• {victory}</div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="feedback-box">
                        <div className="feedback-title">💡 Expert Recommendation</div>
                        <div className="feedback-text">{recommendation}</div>
                    </div>

                    <div className="feedback-box" style={{ background: 'rgba(148, 163, 184, 0.05)', borderColor: 'rgba(148, 163, 184, 0.1)' }}>
                        <div className="feedback-title" style={{ color: '#cbd5e1' }}>📚 Lessons Learned</div>
                        <div className="feedback-text">
                            <div style={{ marginBottom: '12px' }}>
                                <strong>Supplier Relationship Matters:</strong> Trust isn't just soft power. You negotiated at a {negotiationData.trust < 50 ? 'disadvantage' : 'significant advantage'} because of how you handled supplier negotiations.
                            </div>
                            <div style={{ marginBottom: '12px' }}>
                                <strong>Speed vs. Sustainability:</strong> Your war room decisions reveal your philosophy. Fast fixes often create future problems. {warRoomActions.length === 3 ? 'You balanced urgency with long-term thinking.' : 'Consider if your choices sacrificed the future for now.'}
                            </div>
                            <div>
                                <strong>Crisis Preparation:</strong> The {aiInvestments.length} AI investments you selected {aiInvestments.length === 2 ? 'will significantly strengthen your' : 'would have improved your'} crisis resilience going forward.
                            </div>
                        </div>
                    </div>

                    <div style={{ textAlign: 'center', marginTop: '40px', marginBottom: '40px' }}>
                        <button className="button" onClick={onReplay}>
                            Run Another Simulation
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState('welcome');
            const [company, setCompany] = useState(null);
            const [crisis, setCrisis] = useState(null);
            const [warRoomActions, setWarRoomActions] = useState(null);
            const [negotiationData, setNegotiationData] = useState(null);
            const [boardroomScore, setBoardroomScore] = useState(null);
            const [aiInvestments, setAiInvestments] = useState(null);

            const handleStart = () => {
                setCompany(generateCompany());
                setScreen('company');
            };

            const handleCompanyComplete = () => {
                setCrisis(generateCrisis());
                setScreen('crisis');
            };

            const handleCrisisComplete = () => {
                setScreen('warroom');
            };

            const handleWarRoomComplete = (actions) => {
                setWarRoomActions(actions);
                setScreen('negotiation');
            };

            const handleNegotiationComplete = (data) => {
                setNegotiationData(data);
                setScreen('boardroom');
            };

            const handleBoardroomComplete = (score) => {
                setBoardroomScore(score);
                setScreen('aistrategy');
            };

            const handleAIStrategyComplete = (investments) => {
                setAiInvestments(investments);
                setScreen('dashboard');
            };

            const handleReplay = () => {
                setScreen('welcome');
                setCompany(null);
                setCrisis(null);
                setWarRoomActions(null);
                setNegotiationData(null);
                setBoardroomScore(null);
                setAiInvestments(null);
            };

            return (
                <div className="container">
                    <div className="header">
                        <div className="logo">Supply Chain Crisis Management</div>
                        <h1 className="title">Operation Lifeline</h1>
                        <p className="subtitle">Make decisions. Manage consequences. Lead through chaos.</p>
                    </div>

                    <div className="content">
                        {screen === 'welcome' && <WelcomeScreen onStart={handleStart} />}
                        {screen === 'company' && <CompanyScreen company={company} onContinue={handleCompanyComplete} />}
                        {screen === 'crisis' && <CrisisScreen crisis={crisis} company={company} onContinue={handleCrisisComplete} />}
                        {screen === 'warroom' && <WarRoomScreen crisis={crisis} onContinue={handleWarRoomComplete} />}
                        {screen === 'negotiation' && <NegotiationScreen onComplete={handleNegotiationComplete} />}
                        {screen === 'boardroom' && <BoardroomScreen onComplete={handleBoardroomComplete} />}
                        {screen === 'aistrategy' && <AIStrategyScreen onComplete={handleAIStrategyComplete} />}
                        {screen === 'dashboard' && 
                            <FinalDashboardScreen 
                                company={company} 
                                crisis={crisis} 
                                warRoomActions={warRoomActions}
                                negotiationData={negotiationData}
                                boardroomScore={boardroomScore}
                                aiInvestments={aiInvestments}
                                onReplay={handleReplay}
                            />
                        }
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
